services:
  - type: web
    runtime: node
    name: fvmarket-app
    branch: main
    rootDir: appsrc
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RUTAFV_API_URL
        sync: false
      - key: RUTAFV_API_KEY
        sync: false
      - key: RUTAFV_CLIENT_CODE
        value: FVMarket
