name: Patch FVMarket private procurement

on:
  push:
    paths:
      - patch_fvmarket_procurement.py
      - .github/workflows/patch-fvmarket-procurement.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply private procurement patch
        run: python patch_fvmarket_procurement.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/server.js appsrc/public/admin.html
          git commit -m "Ocultar origen al cliente y guardar referencia real para admin" || exit 0
          git push
