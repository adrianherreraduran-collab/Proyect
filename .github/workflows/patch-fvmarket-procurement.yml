name: Patch FVMarket private procurement

on:
  push:
    paths:
      - patch_fvmarket_procurement.py
      - .github/workflows/patch-fvmarket-procurement.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply private procurement patch
        run: python patch_fvmarket_procurement.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Repack FVMarket
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile, io, base64
          root=Path('appsrc')
          buf=io.BytesIO()
          with tarfile.open(fileobj=buf,mode='w:gz') as tar:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      tar.add(p,arcname=str(p.relative_to(root)))
          Path('fvmarket-app.tgz.b64').write_text(base64.b64encode(buf.getvalue()).decode('ascii'),encoding='ascii')
          PY
      - name: Commit patched app and package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/server.js appsrc/public/admin.html fvmarket-app.tgz.b64
          git commit -m "Ocultar origen al cliente y guardar referencia real para admin" || exit 0
          git push
