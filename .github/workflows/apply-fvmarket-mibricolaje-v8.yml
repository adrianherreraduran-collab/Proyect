name: Apply FVMarket MiBricolaje importer v8
on:
  push:
    paths:
      - 'scripts/patch_mibricolaje_import_v8.py'
      - '.github/workflows/apply-fvmarket-mibricolaje-v8.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_mibricolaje_import_v8.py
      - name: Validate backend syntax
        run: node --check appsrc/server.js
      - name: Repack FVMarket
        run: |
          tar -czf fvmarket-app.tgz -C appsrc .
          base64 -w 0 fvmarket-app.tgz > fvmarket-app.tgz.b64
      - name: Commit updated application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appsrc/server.js appsrc/public/admin.html fvmarket-app.tgz.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Aplicar importador inteligente MiBricolaje en FVMarket'
          git push
