name: Apply FVMarket provider blocks v11
on:
  push:
    paths:
      - '.github/workflows/apply-fvmarket-provider-blocks-v11.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply FVMarket v11 patch
        run: python scripts/patch_fvmarket_provider_blocks_v11.py
      - name: Validate JavaScript
        run: |
          node --check appsrc/server.js
          node --check appsrc/provider_sources_v11.js
          node --check appsrc/public/fvmarket-admin-v11.js
      - name: Repack FVMarket
        run: |
          tar -czf fvmarket-app.tgz -C appsrc .
          base64 -w 0 fvmarket-app.tgz > fvmarket-app.tgz.b64
      - name: Commit updated FVMarket application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appsrc/server.js appsrc/provider_sources_v11.js appsrc/public/admin.html appsrc/public/fvmarket-admin-v11.js fvmarket-app.tgz.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Aplicar importadores separados por proveedor FVMarket v11'
          git push
