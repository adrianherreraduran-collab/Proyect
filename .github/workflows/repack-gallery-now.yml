name: Repack FVMarket gallery now

on:
  push:
    paths:
      - trigger-gallery-repack.txt

permissions:
  contents: write

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate server
        run: node --check appsrc/server.js
      - name: Build FVMarket package
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile, io, base64
          root=Path('appsrc')
          buf=io.BytesIO()
          with tarfile.open(fileobj=buf,mode='w:gz') as tar:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): tar.add(p,arcname=str(p.relative_to(root)))
          Path('fvmarket-app.tgz.b64').write_text(base64.b64encode(buf.getvalue()).decode('ascii'),encoding='ascii')
          PY
      - name: Commit package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fvmarket-app.tgz.b64
          git commit -m "Reempaquetar FVMarket con galería internacional" || exit 0
          git push
