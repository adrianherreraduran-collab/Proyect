name: Patch FVMarket assisted URL import

on:
  push:
    paths:
      - patch_fvmarket_assisted_url.py
      - .github/workflows/patch-fvmarket-assisted-url.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply assisted URL import patch
        run: python patch_fvmarket_assisted_url.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Repack FVMarket
        run: tar -czf - -C appsrc . | base64 -w 0 > fvmarket-app.tgz.b64
      - name: Commit patched app and package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/public/admin.html fvmarket-app.tgz.b64
          git commit -m "Añadir modo asistido para URLs bloqueadas en FVMarket" || exit 0
          git push
