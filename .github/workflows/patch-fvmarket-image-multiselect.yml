name: Patch FVMarket image multiselect

on:
  push:
    paths:
      - patch_fvmarket_image_multiselect.py
      - .github/workflows/patch-fvmarket-image-multiselect.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply image multiselect patch
        run: python patch_fvmarket_image_multiselect.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Repack FVMarket
        run: tar -czf - -C appsrc . | base64 -w 0 > fvmarket-app.tgz.b64
      - name: Commit patched app and package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/public/admin.html fvmarket-app.tgz.b64
          git commit -m "Añadir selección múltiple de imágenes en FVMarket" || exit 0
          git push
