name: Extract FVMarket source

on:
  push:
    paths:
      - trigger-extract.txt

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract package
        run: |
          rm -rf appsrc
          mkdir appsrc
          base64 -d fvmarket-app.tgz.b64 > /tmp/fvmarket.tgz
          tar -xzf /tmp/fvmarket.tgz -C appsrc
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc
          git commit -m "Extract FVMarket source for maintenance" || exit 0
          git push
