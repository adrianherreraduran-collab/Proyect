name: Patch FVMarket product gallery

on:
  push:
    paths:
      - patch_fvmarket_product_gallery.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gallery patch
        run: python patch_fvmarket_product_gallery.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/server.js appsrc/public/index.html
          git commit -m "Añadir galería de producto y fotos internacionales" || exit 0
          git push
