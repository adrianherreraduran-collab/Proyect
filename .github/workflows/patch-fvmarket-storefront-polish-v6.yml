name: Patch FVMarket storefront polish v6

on:
  push:
    paths:
      - patch_fvmarket_storefront_polish_v6.py
      - .github/workflows/patch-fvmarket-storefront-polish-v6.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply storefront polish v6
        run: python patch_fvmarket_storefront_polish_v6.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Repack FVMarket
        run: tar -czf - -C appsrc . | base64 -w 0 > fvmarket-app.tgz.b64
      - name: Commit patched storefront
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/public/index.html fvmarket-app.tgz.b64
          git commit -m "Mejorar cabecera ofertas y carruseles FVMarket" || exit 0
          git push
