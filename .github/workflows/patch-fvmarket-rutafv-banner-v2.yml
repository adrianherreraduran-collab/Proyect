name: Patch FVMarket RutaFV banner v2

on:
  push:
    paths:
      - patch_fvmarket_rutafv_banner_v2.py
      - .github/workflows/patch-fvmarket-rutafv-banner-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply RutaFV banner redesign
        run: python patch_fvmarket_rutafv_banner_v2.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Repack FVMarket
        run: tar -czf - -C appsrc . | base64 -w 0 > fvmarket-app.tgz.b64
      - name: Commit patched app and package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/public/index.html fvmarket-app.tgz.b64
          git commit -m "Rediseñar banner RutaFV de FVMarket" || exit 0
          git push
