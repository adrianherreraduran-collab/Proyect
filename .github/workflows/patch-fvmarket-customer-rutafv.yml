name: Patch FVMarket customer RutaFV checkout

on:
  push:
    paths:
      - patch_fvmarket_customer_rutafv.py
      - .github/workflows/patch-fvmarket-customer-rutafv.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply customer and RutaFV checkout patch
        run: python patch_fvmarket_customer_rutafv.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Repack FVMarket
        run: tar -czf - -C appsrc . | base64 -w 0 > fvmarket-app.tgz.b64
      - name: Commit patched app and package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/public/index.html appsrc/server.js fvmarket-app.tgz.b64
          git commit -m "Completar datos de cliente para entregas RutaFV" || exit 0
          git push
