name: Patch FVMarket template v5

on:
  push:
    paths:
      - patch_fvmarket_template_v5.py
      - .github/workflows/patch-fvmarket-template-v5.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply template v5
        run: python patch_fvmarket_template_v5.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Repack FVMarket
        run: tar -czf - -C appsrc . | base64 -w 0 > fvmarket-app.tgz.b64
      - name: Commit patched storefront
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/public/index.html fvmarket-app.tgz.b64
          git commit -m "Aplicar plantilla visual FVMarket variante 5" || exit 0
          git push
