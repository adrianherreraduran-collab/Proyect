name: Patch FVMarket provider and image matching

on:
  push:
    paths:
      - patch_fvmarket_provider_google_images.py
      - .github/workflows/patch-fvmarket-provider-google-images.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply provider and image matching patch
        run: python patch_fvmarket_provider_google_images.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Repack FVMarket
        run: tar -czf - -C appsrc . | base64 -w 0 > fvmarket-app.tgz.b64
      - name: Commit patched app and package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/server.js appsrc/public/admin.html fvmarket-app.tgz.b64
          git commit -m "Mejorar proveedor y coincidencia de imágenes en FVMarket" || exit 0
          git push
