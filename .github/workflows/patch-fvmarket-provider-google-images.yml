name: Patch FVMarket provider and image matching

on:
  push:
    paths:
      - patch_fvmarket_brave_images.py
      - .github/workflows/patch-fvmarket-provider-google-images.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Brave image search patch
        run: python patch_fvmarket_brave_images.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Repack FVMarket
        run: tar -czf - -C appsrc . | base64 -w 0 > fvmarket-app.tgz.b64
      - name: Commit patched app and package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/server.js fvmarket-app.tgz.b64
          git commit -m "Conectar FVMarket con Brave Image Search" || exit 0
          git push
