name: Patch FVMarket address images transport v2

on:
  push:
    paths:
      - patch_fvmarket_address_images_transport_v2.py
      - .github/workflows/patch-fvmarket-address-images-transport-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_fvmarket_address_images_transport_v2.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Repack FVMarket
        run: tar -czf - -C appsrc . | base64 -w 0 > fvmarket-app.tgz.b64
      - name: Commit patched app and package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/server.js appsrc/public/index.html appsrc/public/admin.html fvmarket-app.tgz.b64
          git commit -m "Mejorar autocompletado imágenes manuales y cálculo RutaFV" || exit 0
          git push
