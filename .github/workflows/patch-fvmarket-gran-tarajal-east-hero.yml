name: Patch FVMarket customer accounts and hero

on:
  push:
    paths:
      - patch_fvmarket_gran_tarajal_east_hero.py
      - .github/workflows/patch-fvmarket-gran-tarajal-east-hero.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply FVMarket patch
        run: python patch_fvmarket_gran_tarajal_east_hero.py
      - name: Validate server syntax
        run: node --check appsrc/server.js
      - name: Repack FVMarket
        run: tar -czf - -C appsrc . | base64 -w 0 > fvmarket-app.tgz.b64
      - name: Commit updated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc/server.js appsrc/public/index.html fvmarket-app.tgz.b64
          git commit -m "Aplicar cuentas verificadas y perfil cliente FVMarket" || exit 0
          git push
