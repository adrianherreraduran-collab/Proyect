name: Apply FVMarket admin supplier v14
on:
  push:
    paths:
      - '.github/workflows/apply-fvmarket-admin-supplier-v14.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply FVMarket v14 patch
        run: python scripts/patch_fvmarket_admin_supplier_v14.py
      - name: Install app dependencies
        run: npm install --prefix appsrc --omit=dev
      - name: Validate JavaScript
        run: |
          node --check appsrc/server.js
          node --check appsrc/supplier_capture_v13.js
          node --check appsrc/public/fvmarket-admin-v13.js
          node --check appsrc/public/fvmarket-admin-entry-v14.js
          node --check appsrc/public/fvmarket-admin-security-v14.js
      - name: Verify v14 integration markers
        run: |
          grep -q 'FVM_ADMIN_SECURITY_V14' appsrc/server.js
          grep -q 'adminCredentialsInitializedV14' appsrc/server.js
          grep -q 'fvm_admin_authorized_tab' appsrc/public/admin.html
          grep -q '/fvmarket-admin-entry-v14.js?v=14' appsrc/public/index.html
          grep -q '/fvmarket-admin-security-v14.js?v=14' appsrc/public/admin.html
          grep -q "Cache-Control','no-store" appsrc/supplier_capture_v13.js
          grep -q '_v14=' appsrc/public/fvmarket-admin-v13.js
      - name: Repack FVMarket
        run: |
          tar -czf fvmarket-app.tgz -C appsrc .
          base64 -w 0 fvmarket-app.tgz > fvmarket-app.tgz.b64
      - name: Commit updated FVMarket application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appsrc/server.js appsrc/supplier_capture_v13.js appsrc/public/fvmarket-admin-v13.js appsrc/public/fvmarket-admin-entry-v14.js appsrc/public/fvmarket-admin-security-v14.js appsrc/public/admin.html appsrc/public/index.html fvmarket-app.tgz.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Corregir acceso y proveedores FVMarket v14'
          git push
# validation-retry-v14
